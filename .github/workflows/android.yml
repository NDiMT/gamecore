name: Build Android APK

# Builds a debug .apk you can sideload onto your phone. GitHub's runners can
# reach the Android SDK servers, so this works even though the dev sandbox
# can't. Download the APK from the run's "Artifacts" section when it finishes.

on:
  push:
    branches: ["claude/gamecore-repo-cleanup-ShXBG", "main"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3-stable
  GODOT_TEMPLATES_DIR: /home/runner/.local/share/godot/export_templates/4.3.stable

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          set -e
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "${GODOT_TEMPLATES_DIR}"
          unzip -q templates.tpz -d tpz
          mv tpz/templates/* "${GODOT_TEMPLATES_DIR}/"

      - name: Generate a debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Point Godot at the SDK and keystore
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: godot --headless --path . --import 2>&1 | tail -n 20 || true

      - name: Diagnostics
        run: |
          echo "--- export templates ---"; ls -la "${GODOT_TEMPLATES_DIR}" || true
          echo "--- build-tools ---"; ls "${ANDROID_SDK_ROOT}/build-tools" || true
          echo "--- cmdline-tools ---"; ls "${ANDROID_SDK_ROOT}/cmdline-tools" || true
          echo "--- editor settings ---"; cat ~/.config/godot/editor_settings-4.3.tres

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/gamecore.apk 2>&1 | tee export.log | tail -n 80
          test -f build/gamecore.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamecore-android-apk
          path: build/gamecore.apk
          if-no-files-found: error
