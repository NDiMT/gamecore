<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0612" />
  <title>Chronos · Greenhouse</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0a0612; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; touch-action: manipulation; }
  </style>
</head>
<body>
  <div id="app"></div>
  <pre id="err" style="position:fixed; left:0; right:0; top:0; padding:10px; background:#000; color:#ff8080; font:12px monospace; white-space:pre-wrap; z-index:9999; display:none;"></pre>
  <script>
    window.addEventListener("error", (e) => {
      const el = document.getElementById("err");
      el.style.display = "block";
      el.textContent = "JS error: " + (e.message || e.error?.stack || e);
    });
    window.addEventListener("unhandledrejection", (e) => {
      const el = document.getElementById("err");
      el.style.display = "block";
      el.textContent = "Promise: " + (e.reason?.message || e.reason);
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
